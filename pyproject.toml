[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "afsar"
version = "0.1.0"
description = "LLM API library for students utilizing local agents or remote APIs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
schema = [
    "pydantic>=2.0.0",
]
dev = [
    "ruff>=0.17.0",
    "mypy>=1.9.0",
    "pytest>=8.0.0",
    "xenon>=0.9.0",
    "pre-commit>=3.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src", "."]
